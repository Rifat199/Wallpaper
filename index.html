<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background: #1b4d3e;
            color: white;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        /* Gallery Grid - গুগল ইমেজ সার্চের মতো লেআউট */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* মোবাইলে পাশাপাশি ২টি কলাম */
            gap: 8px; 
            margin-top: 20px;
        }

        /* ডেস্কটপ মোডের জন্য একসাথে ৪টি কলাম */
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr); 
                gap: 15px;
            }
        }

        .wallpaper-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .wallpaper-card:hover {
            transform: translateY(-5px);
        }
        .wallpaper-card img {
            width: 100%;
            height: 230px; 
            object-fit: cover;
            display: block;
        }

        @media (min-width: 768px) {
            .wallpaper-card img {
                height: 280px; 
            }
        }

        /* কার্ডের ফুটার: বাম পাশে লাইক/ডিসলাইক এবং ডান পাশে ডাউনলোড কাউন্ট */
        .card-footer {
            padding: 8px 10px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #555;
            border-top: 1px solid #eee;
        }

        .card-stats {
            display: flex;
            gap: 8px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            color: #555;
        }

        .download-count {
            font-weight: bold;
            color: #1b4d3e;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Lightbox Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 5px;
        }
        .modal-content {
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        /* মডালের নিচের আইকন বাটনগুলোর কন্টেইনার */
        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .modal-action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 18px;
            border-radius: 30px;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
        }

        .modal-action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        /* ইউজার যদি লাইক বা ডিসলাইক দিয়ে থাকে তবে তা হাইলাইট করার জন্য */
        .modal-action-btn.active-like {
            background: #27ae60;
            border-color: #27ae60;
        }

        .modal-action-btn.active-dislike {
            background: #c0392b;
            border-color: #c0392b;
        }

        .btn-count {
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <p>Islamic Wallpaper Gallery</p>
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryGrid">
            <!-- জাভাস্ক্রিপ্ট দিয়ে ছবিগুলো এখানে লোড হবে -->
        </div>
    </div>

    <!-- লাইটবক্স মডাল (বড় প্রিভিউ এবং তিনটি আইকন বাটন) -->
    <div class="modal" id="imageModal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="" alt="Large View">
            <div class="modal-actions">
                <!-- লাইক বাটন (শুধু আইকন ও কাউন্ট) -->
                <button class="modal-action-btn" id="modalLikeBtn" onclick="handleLike()">
                    👍 <span class="btn-count" id="modalLikeCount">0</span>
                </button>
                <!-- ডিসলাইক বাটন (শুধু আইকন ও কাউন্ট) -->
                <button class="modal-action-btn" id="modalDislikeBtn" onclick="handleDislike()">
                    👎 <span class="btn-count" id="modalDislikeCount">0</span>
                </button>
                <!-- ডাউনলোড বাটন (শুধু আইকন ও কাউন্ট) -->
                <button class="modal-action-btn" id="modalDownloadBtn" onclick="handleDownload()">
                    📥 <span class="btn-count" id="modalDownloadCount">0</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // লোকাল স্টোরেজ থেকে ডাটা লোড করা
        let wallpapers = JSON.parse(localStorage.getItem('wallpapers')) || [];

        // ইউজার কোন ছবিতে লাইক বা ডিসলাইক দিয়েছে তা ট্র্যাক করার জন্য লোকালস্টোরেজ থেকে ডাটা লোড
        let userInteractions = JSON.parse(localStorage.getItem('userInteractions')) || {};

        // পুরোনো ডাটাকে নতুন অবজেক্ট ফরম্যাটে কনভার্ট করা
        if (wallpapers.length > 0 && (typeof wallpapers[0] === 'string' || wallpapers[0].likes === undefined)) {
            wallpapers = wallpapers.map(item => {
                let url = typeof item === 'string' ? item : item.url;
                let downloads = typeof item === 'string' ? 0 : (item.downloads || 0);
                return { 
                    url: url, 
                    downloads: downloads, 
                    likes: item.likes || 0, 
                    dislikes: item.dislikes || 0 
                };
            });
            localStorage.setItem('wallpapers', JSON.stringify(wallpapers));
        }

        let currentActiveUrl = '';

        window.onload = function() {
            renderGallery();
        };

        // সংখ্যা ফরম্যাট ফাংশন (k, L, Cr)
        function formatNumber(num) {
            if (num >= 10000000) {
                return (num / 10000000).toFixed(1).replace(/\.0$/, '') + ' Cr';
            }
            if (num >= 100000) {
                return (num / 100000).toFixed(1).replace(/\.0$/, '') + ' L';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            }
            return num;
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (wallpapers.length === 0) {
                grid.innerHTML = '<p>বর্তমানে কোনো ওয়ালপেপার নেই।</p>';
                return;
            }

            wallpapers.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'wallpaper-card';
                card.onclick = () => openModal(item.url);

                const img = document.createElement('img');
                img.src = item.url;
                img.alt = 'Wallpaper';

                // কার্ডের ফুটার: বাম পাশে লাইক/ডিসলাইক এবং ডান পাশে ডাউনলোড কাউন্ট
                const footer = document.createElement('div');
                footer.className = 'card-footer';

                const statsDiv = document.createElement('div');
                statsDiv.className = 'card-stats';
                statsDiv.innerHTML = `
                    <span class="stat-item">👍 ${formatNumber(item.likes || 0)}</span>
                    <span class="stat-item">👎 ${formatNumber(item.dislikes || 0)}</span>
                `;

                const downloadSpan = document.createElement('span');
                downloadSpan.className = 'download-count';
                downloadSpan.innerHTML = `${formatNumber(item.downloads || 0)} 📥`;

                footer.appendChild(statsDiv);
                footer.appendChild(downloadSpan);
                
                card.appendChild(img);
                card.appendChild(footer);
                grid.appendChild(card);
            });
        }

        function openModal(url) {
            currentActiveUrl = url; 
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');

            modal.style.display = 'flex';
            modalImg.src = url;

            updateModalUI();
        }

        // মডালের ভেতরের কাউন্ট ও স্টাইল আপডেট করার ফাংশন
        function updateModalUI() {
            const item = wallpapers.find(w => w.url === currentActiveUrl);
            if (!item) return;

            document.getElementById('modalLikeCount').innerText = formatNumber(item.likes || 0);
            document.getElementById('modalDislikeCount').innerText = formatNumber(item.dislikes || 0);
            document.getElementById('modalDownloadCount').innerText = formatNumber(item.downloads || 0);

            const likeBtn = document.getElementById('modalLikeBtn');
            const dislikeBtn = document.getElementById('modalDislikeBtn');

            likeBtn.classList.remove('active-like');
            dislikeBtn.classList.remove('active-dislike');

            let userState = userInteractions[currentActiveUrl];
            if (userState === 'like') {
                likeBtn.classList.add('active-like');
            } else if (userState === 'dislike') {
                dislikeBtn.classList.add('active-dislike');
            }
        }

        // সিঙ্গেল লাইক লজিক
        function handleLike() {
            const item = wallpapers.find(w => w.url === currentActiveUrl);
            if (!item) return;

            let userState = userInteractions[currentActiveUrl];

            if (userState === 'like') {
                item.likes--;
                delete userInteractions[currentActiveUrl];
            } else {
                if (userState === 'dislike') {
                    item.dislikes--;
                }
                item.likes = (item.likes || 0) + 1;
                userInteractions[currentActiveUrl] = 'like';
            }

            localStorage.setItem('wallpapers', JSON.stringify(wallpapers));
            localStorage.setItem('userInteractions', JSON.stringify(userInteractions));
            updateModalUI();
            renderGallery();
        }

        // সিঙ্গেল ডিসলাইক লজিক
        function handleDislike() {
            const item = wallpapers.find(w => w.url === currentActiveUrl);
            if (!item) return;

            let userState = userInteractions[currentActiveUrl];

            if (userState === 'dislike') {
                item.dislikes--;
                delete userInteractions[currentActiveUrl];
            } else {
                if (userState === 'like') {
                    item.likes--;
                }
                item.dislikes = (item.dislikes || 0) + 1;
                userInteractions[currentActiveUrl] = 'dislike';
            }

            localStorage.setItem('wallpapers', JSON.stringify(wallpapers));
            localStorage.setItem('userInteractions', JSON.stringify(userInteractions));
            updateModalUI();
            renderGallery();
        }

        // ডাউনলোড কাউন্ট বাড়ানো, ছবি ডাউনলোড করা এবং এডস্টার্তা লিংক ওপেন করা
        function handleDownload() {
            const item = wallpapers.find(w => w.url === currentActiveUrl);
            if (item) {
                item.downloads = (item.downloads || 0) + 1;
                localStorage.setItem('wallpapers', JSON.stringify(wallpapers));
                updateModalUI();
                renderGallery();

                // ১. বিজ্ঞাপনের লিংকটি নতুন ট্যাবে ওপেন হবে (ইনকামের জন্য)
                window.open('https://omg10.com/4/11003504', '_blank');

                // ২. ছবি ডাউনলোডের মূল কাজ সম্পন্ন হবে
                fetch(currentActiveUrl)
                    .then(response => response.blob())
                    .then(blob => {
                        const blobUrl = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = 'wallpaper_' + Date.now() + '.jpg';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(blobUrl);
                    })
                    .catch(() => {
                        // CORS ব্লকিং এড়াতে বিকল্প পদ্ধতি
                        window.open(currentActiveUrl, '_blank');
                    });
            }
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }
    </script>

</body>
</html>
