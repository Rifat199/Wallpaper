<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন আপলোড প্যানেল ও অটো-ট্যাগ সিস্টেম</title>
    
    <!-- ফায়ারবেস SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-box {
            background: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            position: relative;
        }
        .admin-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #1abc9c;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #7f8c8d;
            border-radius: 5px;
            background: #2c3e50;
            color: white;
            font-size: 14px;
        }
        .form-group select option {
            background: #2c3e50;
            color: white;
        }
        .btn {
            background: #1abc9c;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover {
            background: #16a085;
        }
        #uploadStatus {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .logout-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #c0392b;
        }

        .report-box {
            margin-top: 25px;
            background: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
        }
        .report-box h3 {
            color: #f39c12;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
        }
        .report-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #34495e;
        }
        .report-item span:last-child {
            font-weight: bold;
            color: #1abc9c;
        }
    </style>
</head>
<body>

    <div class="admin-box" id="loginBox">
        <h2>অ্যাডমিন লগইন</h2>
        <div class="form-group">
            <label for="adminPass">পাসওয়ার্ড দিন:</label>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড লিখুন">
        </div>
        <button class="btn" onclick="checkPassword()">লগইন করুন</button>
        <p id="loginStatus" style="margin-top: 15px; text-align: center; color: #e74c3c; font-weight: bold;"></p>
    </div>

    <div class="admin-box" id="panelBox" style="display: none;">
        <button class="logout-btn" onclick="logoutAdmin()">লগআউট</button>
        <h2>অ্যাডমিন প্যানেল (অটো-ট্যাগ)</h2>
        <div class="form-group">
            <label for="apiKey">ImgBB API Key:</label>
            <input type="text" id="apiKey" value="32f9578ec23b3aeeaf05e3d062cb2132">
        </div>
        
        <div class="form-group">
            <label for="wallpaperCategory">১. মূল ক্যাটাগরি সিলেক্ট করুন:</label>
            <select id="wallpaperCategory">
                <option value="islamic">Islamic</option>
                <option value="hindu">Hindu</option>
                <option value="christian">Christian</option>
                <option value="buddhist">Buddhist</option>
                <option value="nature">Nature</option>
                <option value="flowers">Flowers</option>
                <option value="buildings">Buildings</option>
                <option value="love">Love</option>
                <option value="animals">Animals</option>
                <option value="cityscapes">Cityscapes</option>
            </select>
        </div>

        <!-- নতুন সাব-টাইপ ড্রপডাউন: GIF, 3D, 4K ইত্যাদি -->
        <div class="form-group">
            <label for="wallpaperSubType">২. ওয়ালপেপারের ধরণ (Sub-Type):</label>
            <select id="wallpaperSubType">
                <option value="hd">HD / Normal</option>
                <option value="3d">3D Wallpaper</option>
                <option value="4k">4K Ultra HD</option>
                <option value="gif">GIF / Animated</option>
                <option value="art">Artistic / Painting</option>
            </select>
        </div>

        <div class="form-group">
            <label for="imageFile">৩. ওয়ালপেপার ছবি সিলেক্ট করুন:</label>
            <input type="file" id="imageFile" accept="image/*">
        </div>
        
        <button class="btn" onclick="uploadWallpaper()">অটো-ট্যাগসহ আপলোড করুন</button>
        <p id="uploadStatus"></p>

        <div class="report-box">
            <h3>📊 সাইট ও ফটো রিপোর্ট</h3>
            <div class="report-item">
                <span>মোট সাইট ভিজিটর (Views):</span>
                <span id="totalVisitsCount">লোড হচ্ছে...</span>
            </div>
            <div class="report-item">
                <span>মোট আপলোডকৃত ছবি:</span>
                <span id="totalWallpapersCount">লোড হচ্ছে...</span>
            </div>
            <div class="report-item">
                <span>সর্বাধিক ডাউনলোড হওয়া ছবি:</span>
                <span id="topDownloadedCount">লোড হচ্ছে...</span>
            </div>
        </div>
    </div>

    <script>
        const correctPassword = "Rifat$1993";

        window.onload = function() {
            if (localStorage.getItem("isAdminLoggedIn") === "true") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'block';
                loadAdminReports();
            }
        };

        function checkPassword() {
            const passInput = document.getElementById('adminPass').value;
            const loginStatus = document.getElementById('loginStatus');

            if (passInput === correctPassword) {
                localStorage.setItem("isAdminLoggedIn", "true");
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'block';
                loadAdminReports();
            } else {
                loginStatus.innerText = 'ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("isAdminLoggedIn");
            document.getElementById('panelBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPass').value = '';
            document.getElementById('loginStatus').innerText = '';
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBmW8LE1Z22u4NiFtkTkU7SJtOZhy4tQLik",
            authDomain: "wallpaper-76b9a.firebaseapp.com",
            databaseURL: "https://wallpaper-76b9a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wallpaper-76b9a",
            storageBucket: "wallpaper-76b9a.firebasestorage.app",
            messagingSenderId: "717212155948",
            appId: "1:717212155948:web:d20a8a7286e4b98f4f1189"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadAdminReports() {
            database.ref('site_stats/total_visits').on('value', (snapshot) => {
                const visits = snapshot.val() || 0;
                document.getElementById('totalVisitsCount').innerText = visits;
            });

            database.ref('wallpapers').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('totalWallpapersCount').innerText = '0';
                    document.getElementById('topDownloadedCount').innerText = 'নেই';
                    return;
                }

                let totalCount = 0;
                let maxDownloads = -1;
                let topItemName = 'নেই';

                Object.keys(data).forEach(categoryKey => {
                    let categoryItems = data[categoryKey];
                    if (categoryItems) {
                        Object.keys(categoryItems).forEach(idKey => {
                            let item = categoryItems[idKey];
                            totalCount++;

                            let downloads = item.downloads || 0;
                            if (downloads > maxDownloads) {
                                maxDownloads = downloads;
                                topItemName = `${downloads} বার ডাউনলোড`;
                            }
                        });
                    }
                });

                document.getElementById('totalWallpapersCount').innerText = totalCount;
                document.getElementById('topDownloadedCount').innerText = topItemName;
            });
        }

        // ক্যাটাগরি ও সাব-টাইপ অনুযায়ী স্বয়ংক্রিয়ভাবে রিচ এসইও কিওয়ার্ড ট্যাগ জেনারেট করার ফাংশন
        function generateAutoTags(category, subType) {
            let baseKeywords = {
                islamic: "islamic wallpaper, muslim background, allah arabic calligraphy, madina makkah kaaba, mosque architecture, quranic ayat, ramadan eid images",
                hindu: "hindu god wallpaper, shiva mahadev, radha krishna, hanuman bajrangbali, mandir divine background, durga puja festival",
                christian: "christian wallpaper, jesus christ cross, bible verse background, church chapel holy spirit, cross glowing art",
                buddhist: "buddhist wallpaper, buddha statue peace, meditation temple zen, calm spiritual background",
                nature: "nature landscape wallpaper, green forest mountains, beautiful river water stream, waterfall scenery, sunrise sunset outdoors",
                flowers: "flower wallpaper, red rose bouquet, colorful garden blossom, spring floral background, sunflower macro",
                buildings: "architecture building wallpaper, modern skyscraper, ancient palace structure, futuristic engineering design",
                love: "love wallpaper, romantic couple heart, red roses valentine, sweet moments background",
                animals: "wild animals wallpaper, cute pets cats dogs, majestic lion tiger wildlife, birds in sky",
                cityscapes: "cityscape night lights, urban metropolis skyline, downtown street view towers, glowing neon city"
            };

            let subKeywords = {
                hd: "high definition mobile wallpaper, stock photo, clear background",
                "3d": "3d wallpaper, dimensional depth effect, perspective art, illusion background",
                "4k": "4k ultra hd resolution, high quality sharp details, desktop mobile background",
                gif: "gif animated moving effect, live animation style, looping motion picture",
                art: "artistic painting style, digital illustration, creative graphic design"
            };

            let catTags = baseKeywords[category] || category;
            let subTags = subKeywords[subType] || "";

            // সব ট্যাগ একসাথে যুক্ত করে দেওয়া হচ্ছে যাতে সার্চ বক্সে যেকোনো কিওয়ার্ড লিখলে ম্যাচ করে
            return `${category} ${subType} ${catTags}, ${subTags}, best mobile wallpaper, free download`;
        }

        async function uploadWallpaper() {
            const apiKeyInput = document.getElementById('apiKey').value.trim();
            const categoryInput = document.getElementById('wallpaperCategory').value;
            const subTypeInput = document.getElementById('wallpaperSubType').value;
            const fileInput = document.getElementById('imageFile').files[0];
            const statusText = document.getElementById('uploadStatus');

            if (!apiKeyInput) {
                alert('দয়া করে API Key দিন!');
                return;
            }
            if (!fileInput) {
                alert('দয়া করে একটি ছবি সিলেক্ট করুন!');
                return;
            }

            statusText.style.color = '#f1c40f';
            statusText.innerText = 'ছবি আপলোড ও অটো-ট্যাগ প্রসেসিং চলছে...';

            const formData = new FormData();
            formData.append('image', fileInput);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKeyInput}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.url;
                    
                    // এখানে স্বয়ংক্রিয়ভাবে ট্যাগ জেনারেট করে টাইটেল ফিল্ডে সেভ করা হচ্ছে
                    const generatedTags = generateAutoTags(categoryInput, subTypeInput);

                    // ফায়ারবেসে ডাটা পাঠানো হচ্ছে
                    database.ref('wallpapers/' + categoryInput).push({
                        url: imageUrl,
                        category: categoryInput,
                        title: generatedTags, // অটো-জেনোরেটেড ট্যাগগুলো এখানে সেভ হলো
                        downloads: 0,
                        likes: 0,
                        dislikes: 0
                    });

                    statusText.style.color = '#2ecc71';
                    statusText.innerText = 'সফলভাবে আপলোড এবং অটো-ট্যাগ যুক্ত হয়েছে!';
                    document.getElementById('imageFile').value = '';
                } else {
                    statusText.style.color = '#e74c3c';
                    statusText.innerText = 'ব্যর্থ হয়েছে: ' + data.error.message;
                }
            } catch (error) {
                statusText.style.color = '#e74c3c';
                statusText.innerText = 'ত্রুটি ঘটেছে: ' + error.message;
            }
        }
    </script>

</body>
</html>
