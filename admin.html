<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন আপলোড প্যানেল</title>
    
    <!-- ফায়ারবেস SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #2c3e50;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .admin-box {
            background: #34495e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .admin-box h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #1abc9c;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #7f8c8d;
            border-radius: 5px;
            background: #2c3e50;
            color: white;
        }
        .btn {
            background: #1abc9c;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover {
            background: #16a085;
        }
        #uploadStatus {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #bdc3c7;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .logout-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

    <div class="admin-box" id="loginBox">
        <h2>অ্যাডমিন লগইন</h2>
        <div class="form-group">
            <label for="adminPass">পাসওয়ার্ড দিন:</label>
            <input type="password" id="adminPass" placeholder="পাসওয়ার্ড লিখুন">
        </div>
        <button class="btn" onclick="checkPassword()">লগইন করুন</button>
        <p id="loginStatus" style="margin-top: 15px; text-align: center; color: #e74c3c; font-weight: bold;"></p>
        <a href="index.html" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>

    <div class="admin-box" id="panelBox" style="display: none;">
        <button class="logout-btn" onclick="logoutAdmin()">লগআউট</button>
        <h2>অ্যাডমিন প্যানেল</h2>
        <div class="form-group">
            <label for="apiKey">ImgBB API Key:</label>
            <input type="text" id="apiKey" value="475440804bcea6371364911682370b57">
        </div>
        <div class="form-group">
            <label for="imageFile">ওয়ালপেপার সিলেক্ট করুন:</label>
            <input type="file" id="imageFile" accept="image/*">
        </div>
        <button class="btn" onclick="uploadWallpaper()">সরাসরি আপলোড করুন</button>
        <p id="uploadStatus"></p>
        <a href="index.html" class="back-link">← মূল ওয়েবসাইটে ফিরে যান</a>
    </div>

    <script>
        const correctPassword = "Rifat$1993";

        window.onload = function() {
            if (localStorage.getItem("isAdminLoggedIn") === "true") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'block';
            }
        };

        function checkPassword() {
            const passInput = document.getElementById('adminPass').value;
            const loginStatus = document.getElementById('loginStatus');

            if (passInput === correctPassword) {
                localStorage.setItem("isAdminLoggedIn", "true");
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('panelBox').style.display = 'block';
            } else {
                loginStatus.innerText = 'ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।';
            }
        }

        function logoutAdmin() {
            localStorage.removeItem("isAdminLoggedIn");
            document.getElementById('panelBox').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPass').value = '';
            document.getElementById('loginStatus').innerText = '';
        }

        // ফায়ারবেস কনফিগারেশন (আপনার স্ক্রিনশট অনুযায়ী)
        const firebaseConfig = {
            apiKey: "AIzaSyBmW8LE1Z22u4NiFtkTkU7SJtOZhy4tQLik",
            authDomain: "wallpaper-76b9a.firebaseapp.com",
            databaseURL: "https://wallpaper-76b9a-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wallpaper-76b9a",
            storageBucket: "wallpaper-76b9a.firebasestorage.app",
            messagingSenderId: "717212155948",
            appId: "1:717212155948:web:d20a8a7286e4b98f4f1189"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function uploadWallpaper() {
            const apiKeyInput = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('imageFile').files[0];
            const statusText = document.getElementById('uploadStatus');

            if (!apiKeyInput) {
                alert('দয়া করে API Key দিন!');
                return;
            }
            if (!fileInput) {
                alert('দয়া করে একটি ছবি সিলেক্ট করুন!');
                return;
            }

            statusText.style.color = '#f1c40f';
            statusText.innerText = 'আপলোড হচ্ছে, অপেক্ষা করুন...';

            const formData = new FormData();
            formData.append('image', fileInput);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${apiKeyInput}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.url;
                    
                    // সরাসরি ফায়ারবেস ডাটাবেসে সেভ করা (সবার জন্য লাইভ দেখানোর জন্য)
                    database.ref('wallpapers').push({
                        url: imageUrl,
                        downloads: 0,
                        likes: 0,
                        dislikes: 0
                    });

                    statusText.style.color = '#2ecc71';
                    statusText.innerText = 'সফলভাবে আপলোড হয়েছে!';
                    document.getElementById('imageFile').value = '';
                } else {
                    statusText.style.color = '#e74c3c';
                    statusText.innerText = 'ব্যর্থ হয়েছে: ' + data.error.message;
                }
            } catch (error) {
                statusText.style.color = '#e74c3c';
                statusText.innerText = 'ত্রুটি ঘটেছে: ' + error.message;
            }
        }
    </script>

</body>
</html>
